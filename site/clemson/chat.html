<meta charset="utf-8"><title>SDR · Message the team</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Client "Message the team" thread. Messages-app feel on the dashboard's navy: slim header, clean bubbles, time between groups, sender once per group. */
:root{
  --bg:#0A1428; --panel:#111E42; --panel2:#182A5C; --line:#2B3F6B;
  --fg:#F4F7FB; --muted:#A9B6CC; --dim:#6F7F9E;
  --accent:#F28C28; --blue:#2F7CF6; --bubble:#1C2C5A;
  --clear:#22C55E; --clear-bg:#0F2E22; --clear-line:#1E5A3A;
  --heads:#F5B800; --heads-bg:#3A2B06; --heads-line:#7A5E10;
  --action:#E5484D; --action-bg:#3B0F13; --action-line:#8E2A30;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:560px;margin:0 auto;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--bg);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* header: like a Messages contact header */
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(10,20,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
.hd .back{color:var(--blue);display:flex;align-items:center}
.hd .who{display:grid;justify-items:center;gap:3px}
.logo{background:#fff;border-radius:8px;padding:4px 7px;display:flex}
.logo img{height:22px;width:auto;display:block}
.hd .who b{font-size:13px;font-weight:600}
.hd .who small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.hd .who small::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--clear)}
.hd .who small.off::before{background:var(--dim)}
.hd .more{color:var(--blue);font-size:22px;text-align:right}

/* pinned: one slim strip */
.pin{margin:8px 12px 0;border-radius:12px;background:var(--heads-bg);border:1px solid var(--heads-line);padding:8px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.pin .dot{width:9px;height:9px;border-radius:50%;background:var(--heads);box-shadow:0 0 0 4px rgba(245,184,0,.18)}
.pin b{display:block;font-weight:600}
.pin small{color:var(--muted);font-size:12.5px}
.pin .go{color:var(--heads);font-weight:700;font-size:13px}

/* thread */
.msgs{overflow-y:auto;padding:10px 12px 8px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.ts{text-align:center;font-size:11.5px;color:var(--dim);margin:12px 0 6px;font-weight:600}
.ts b{color:var(--muted);font-weight:700}
.who-l{font-size:11.5px;color:var(--dim);margin:6px 0 2px 14px}
.b{max-width:78%;padding:8px 13px;border-radius:19px;font-size:17px;line-height:1.3;word-wrap:break-word;position:relative}
.b.them{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:5px}
.b.them.cont{border-top-left-radius:5px}
.b.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.b.me.cont{border-top-right-radius:5px}
.b+.b{margin-top:2px}
.b.them+.b.me,.b.me+.b.them{margin-top:10px}
.status{align-self:flex-end;font-size:11.5px;color:var(--dim);margin:3px 6px 0;font-weight:600}
.status.read{color:var(--muted)}
.b .st{display:block;font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:14px;margin-bottom:2px;text-transform:uppercase}
.st.clear{color:var(--clear)} .st.heads{color:var(--heads)} .st.action{color:var(--action)}
.img{align-self:flex-start;max-width:78%;width:280px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);margin-top:3px}
.img.me{align-self:flex-end}
.img .pic{height:150px;background:
  radial-gradient(circle at 60% 55%,rgba(229,72,77,.9) 0 6%,rgba(245,184,0,.85) 9%,rgba(34,197,94,.8) 15%,transparent 22%),
  radial-gradient(circle at 35% 40%,rgba(34,197,94,.55) 0 10%,transparent 16%),
  linear-gradient(180deg,#3B4C7A,#1C2C5A);position:relative}
.img .pic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.07) 22px 23px),repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.07) 22px 23px)}
.img .pic.photo{background:linear-gradient(180deg,#7A8BB0 0%,#3B4C7A 45%,#2A2F3F 70%,#1A1C26 100%)}
.img .cap{font-size:12.5px;color:var(--muted);padding:6px 10px;background:var(--bubble);display:flex;justify-content:space-between;gap:8px}
.img .cap b{color:var(--fg);font-weight:600}
.rc{align-self:flex-start;max-width:78%;width:300px;border-radius:16px;overflow:hidden;background:var(--bubble);padding:10px 12px;display:grid;gap:7px;margin-top:3px}
.rc .t{display:flex;justify-content:space-between;align-items:baseline}
.rc .t b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.01em}
.rc .t span{font-size:12px;color:var(--muted)}
.rc .bar{position:relative;height:24px}
.rc .base{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--line)}
.rc .iq{position:absolute;top:7px;height:10px;border-radius:5px;background:var(--blue)}
.rc .md{position:absolute;top:2px;width:3px;height:20px;background:#fff;border-radius:2px}
.rc .th{position:absolute;top:0;width:2px;height:24px;background:var(--action)}
.rc .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.rc .lab b{color:var(--fg)}
.rc p{margin:0;font-size:14px;line-height:1.35}
.rc p b{color:var(--heads)}
.rc small{font-size:10.5px;color:var(--dim)}
.ack{align-self:flex-start;margin:6px 0 2px 2px;display:flex;align-items:center;gap:8px}
.ack button{font-size:13px;font-weight:700;border:1.5px solid var(--blue);color:var(--blue);border-radius:999px;padding:4px 12px}
.ack button.done{border-color:var(--clear-line);color:var(--clear);background:var(--clear-bg)}
.ack small{font-size:11.5px;color:var(--dim)}
.typing{align-self:flex-start;background:var(--bubble);border-radius:19px;border-bottom-left-radius:5px;padding:10px 14px;display:flex;gap:4px;margin-top:10px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:1;transform:translateY(-2px)}}

/* bottom: suggestions + compose */
.bottom{display:grid;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.08);background:var(--bg)}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;font-size:14px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:6px 13px;color:var(--fg);background:var(--panel)}
.quick button.brief{color:var(--accent);border-color:rgba(242,140,40,.6)}
.compose{display:flex;gap:8px;align-items:center}
.compose .plus{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:22px;color:var(--muted);line-height:1}
.compose .field{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px;min-width:0;background:var(--panel)}
.compose input{flex:1;min-width:0;background:none;color:var(--fg);border:0;font:inherit;font-size:17px;padding:5px 0}
.compose input::placeholder{color:var(--dim)}
.compose .go{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.compose .go svg{width:14px;height:14px}
.demo{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:5;display:flex;gap:5px;opacity:.85}
.demo button,.demo span{font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:.1em;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--muted);background:var(--bg)}
.demo button.on{color:var(--fg);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.smp{font-size:11px;color:#6F7F9E;margin:-4px 0 8px 12px;letter-spacing:.02em}
.img .svgpic{background:#0E1A33;line-height:0}.img .svgpic svg{width:100%;height:auto;display:block}
</style>

<div class="app">
  <header class="hd">
    <button class="back" aria-label="Back to dashboard"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>
    <div class="who"><span class="logo"><img id="logo" alt="SDR Weather Intelligence"></span><b>Meteorologist team</b><small id="promise">Replies within 15 min</small></div>
    <button class="more" aria-label="More">⋯</button>
  </header>
  <div class="pin" id="pin"><span class="dot"></span><div><b>Severe storms possible Saturday afternoon</b><small>Level 2 of 5 for Clemson · Thu 7:05 AM</small></div><span class="go">Briefing ›</span></div>
  <div class="msgs" id="msgs"></div>
  <div class="bottom">
    <div class="quick" id="quick"></div>
    <form class="compose" id="compose"><button type="button" class="plus" id="cam" aria-label="Send a photo">+</button><div class="field"><input id="ci" placeholder="Message" autocomplete="off"><button type="submit" class="go" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg></button></div></form>
  </div>
</div>
<div class="demo"><span>SAMPLE</span><button class="on" id="d-day">DAY</button><button id="d-night">AFTER HRS</button><button id="d-reset">RESET</button></div>

<script>
// ===================== SAMPLE METEOROLOGIST (Emma) =====================
// Reads the live dashboard this widget sits inside (same site, so window.parent is ours) and writes a reply the way the team would:
// short, decision language, model agreement in words, never "confidence". Every reply carries a small "sample" note.
// This is a stand-in until the desk server and real meteorologists are wired; it is deliberately conservative.
var SDR_ENGINE=(function(){
  var P=null; try{ P=window.parent&&window.parent!==window?window.parent:null; }catch(e){ P=null; }
  function g(fn,dflt){ try{ var v=fn(); return v==null?dflt:v; }catch(e){ return dflt; } }
  var DAYN=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  function siteName(){ return g(function(){ return P.DASH.venue().name; },"your site"); }
  function days(){ return g(function(){ return P.STRIPS.days(); },[]); }
  function hours(){ return g(function(){ return P.STRIPS.hours(); },[]); }
  function conf(d){ var C=g(function(){ return P.SDR_CONF; },[]); var ymd=d&&d.date?new Date(d.date).toLocaleDateString("en-CA"):""; var r=C.find(function(c){ return String(c.date).slice(0,10)===ymd; }); return r?r.conf:(d&&d.conf!=null?d.conf:null); }
  function agreeWord(c){ if(c==null) return ""; return c>=4?"the models mostly agree":c===3?"the models are in fair agreement":"the models disagree on this one"; }
  function alerts(){ return g(function(){ return (P.ALERTS||[]).map(function(a){ return a.properties||a; }); },[]); }
  function radar(){ return g(function(){ return P.RADAR_NEAR; },null); }
  function callNow(){ return g(function(){ var c=P.document.getElementById("call"); return c.classList.contains("action")?"action":c.classList.contains("headsup")?"headsup":"clear"; },"clear"); }
  function whyNow(){ return g(function(){ return P.document.getElementById("st-why").textContent.trim(); },""); }
  function hlab(h){ h=((h%24)+24)%24; return h===0?"midnight":h===12?"noon":(h%12)+(h<12?" AM":" PM"); }
  function hrOf(t){ return new Date(t).getHours(); }
  function inch(v){ return v==null?null:(v<1?"a trace":(v/100).toFixed(2)+'"'); }
  function fmtWin(a,b){ if(a==null) return ""; return b!=null&&b!==a?hlab(a)+" to "+hlab(b):"around "+hlab(a); }

  // which day is the question about?
  function whichDay(q){ q=q.toLowerCase(); var D=days(); if(!D.length) return null; var today=new Date(); today.setHours(0,0,0,0);
    var idx=null;
    if(/\btonight\b/.test(q)) idx=0; else if(/\btomorrow\b/.test(q)) idx=1; else if(/\btoday\b|\bright now\b|\bnow\b|\bcurrently\b/.test(q)) idx=0;
    else { for(var i=0;i<7;i++){ var re=new RegExp("\\b"+DAYN[i].slice(0,3)+"[a-z]*\\b"); if(re.test(q)){ var d=new Date(today); var diff=(i-today.getDay()+7)%7; if(diff===0&&/\bnext\b/.test(q)) diff=7; d.setDate(d.getDate()+diff); idx=D.findIndex(function(x){ return new Date(x.date).toDateString()===d.toDateString(); }); break; } }
      if(idx==null&&/\bweekend\b/.test(q)){ idx=D.findIndex(function(x){ var g=new Date(x.date).getDay(); return g===6; }); }
      if(idx==null&&/\bthis week\b|\bweek\b/.test(q)) return {idx:-1,day:null,week:true}; }
    if(idx==null||idx<0) idx=0; var named=DAYN.find(function(n){ return new RegExp("\\b"+n.slice(0,3)+"[a-z]*\\b").test(q); });
    return {idx:idx,day:D[idx],label: /\btonight\b/.test(q)?"tonight": named?(named.charAt(0).toUpperCase()+named.slice(1)):null};
  }
  function topic(q){ q=q.toLowerCase();
    if(/lightning|strike|bolt/.test(q)) return "lightning";
    if(/thunder|storm|severe|tornado|hail/.test(q)) return "storms";
    if(/rain|shower|wet|precip|umbrella|pour|concrete|paint|spray|mow/.test(q)) return "rain";
    if(/wind|gust|breez|blow/.test(q)) return "wind";
    if(/freez|frost|cold|low temp|how cold|ice/.test(q)) return "cold";
    if(/hot|heat|humid|wbgt|how warm|high temp|temperature|temp\b/.test(q)) return "temp";
    if(/snow|flurr|sleet|winter/.test(q)) return "snow";
    return "general";
  }
  function dayHours(d){ if(!d) return []; var day=new Date(d.date).toDateString(); return hours().filter(function(h){ return new Date(h.t).toDateString()===day; }); }
  function wetWindow(H,field,thr){ var ks=H.filter(function(h){ return (h[field]||0)>=thr; }).map(function(h){ return hrOf(h.t); }); if(!ks.length) return null; return {a:Math.min.apply(null,ks),b:Math.max.apply(null,ks)+1,peak:Math.max.apply(null,H.map(function(h){ return h[field]||0; }))}; }
  function dayName(d,idx,label){ if(label) return label; if(idx===0) return "today"; if(idx===1) return "tomorrow"; return d.long||new Date(d.date).toLocaleDateString("en-US",{weekday:"long"}); }

  function outlookLevel(idx){ try{ var cards=[].slice.call(P.document.querySelectorAll("#mrPrev .mcard")); var c=cards.find(function(x){ return (x.dataset.id||"")==="spc"+(idx+1); }); if(!c) return null; var t=(c.textContent||""); var m=t.match(/Level\s*(\d)\s*of\s*5/i); return m?+m[1]:(/flag|prio/.test(c.className)?2:null); }catch(e){ return null; } }
  var OPEN=["Here's where we land:","Looking at it right now:","Quick read for you:","Here's what we're seeing:","Straight answer:","What the numbers say for your site:"]; var lastOpen="";
  function opener(){ var p=OPEN.filter(function(o){ return o!==lastOpen; }); lastOpen=p[Math.floor(Math.random()*p.length)]; return lastOpen; }

  function answer(q){
    var site=siteName(), A=alerts(), R=radar(), call=callNow(), t=topic(q), W=whichDay(q);
    var warn=A.find(function(a){ return /Warning/.test(a.event||""); }), watch=A.find(function(a){ return /Watch/.test(a.event||""); });
    // RIGHT NOW questions, or a warning in effect, come first
    if(call==="action"||(t==="lightning")||/\bright now\b|\bnow\b|\bcurrently\b|\bradar\b/.test(q.toLowerCase())&&!W.week&&W.idx===0){
      var parts=[];
      if(warn) parts.push((warn.event||"A warning")+" covers "+site+" until "+new Date(warn.ends||warn.expires).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+". Get people under cover now.");
      else if(call==="headsup") parts.push("We're at HEADS UP for "+site+": "+whyNow());
      else parts.push("All clear at "+site+" right now."+(R&&!R.none&&!R.light?" "+(R.kind.charAt(0).toUpperCase()+R.kind.slice(1))+" is "+Math.round(R.d)+" miles to your "+R.dir+".":R&&!R.none&&R.light?" Some light returns "+Math.round(R.d)+" miles "+R.dir+", nothing reaching the ground.":" Radar is quiet within 45 miles."));
      if(t==="lightning") parts.push(g(function(){ return P.LTG&&P.LTG.connected; },false)?"Lightning feed is live; nothing inside 10 miles.":"Our lightning feed isn't connected for this site yet, so we're reading storms off radar. No storm cells near you at the moment.");
      if(watch&&!warn) parts.push("A "+watch.event+" is up until "+new Date(watch.ends||watch.expires).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+"; we'll call it the moment anything develops.");
      return parts.join(" ");
    }
    if(W.week){ var D=days().slice(0,7); var wet=D.filter(function(d){ return Math.max(d.pp||0,d.ppN||0)>=40; }); var st=D.filter(function(d){ return (d.thunder||0)>=30; });
      var s=opener()+" ";
      if(!wet.length) s+="Dry week for "+site+". Highs "+Math.min.apply(null,D.map(function(d){ return d.hi; }).filter(Boolean))+" to "+Math.max.apply(null,D.map(function(d){ return d.hi; }).filter(Boolean))+".";
      else s+="The days to plan around are "+wet.map(function(d){ return (d.long||d.d)+" ("+Math.max(d.pp||0,d.ppN||0)+"% rain"+((d.thunder||0)>=30?", storms":"")+")"; }).join(" and ")+". The rest looks workable.";
      var gusty=D.filter(function(d){ return (d.gust||0)>=30; }); if(gusty.length) s+=" Gusty "+gusty.map(function(d){ return d.long||d.d; }).join(", ")+" — "+Math.max.apply(null,gusty.map(function(d){ return d.gust; }))+" mph at the top.";
      return s; }
    var d=W.day, idx=W.idx, H=dayHours(d), nm=dayName(d,idx,W.label), c=conf(d), ag=agreeWord(c);
    var pp=Math.max(d.pp||0,d.ppN||0), th=d.thunder||0, rw=wetWindow(H,"pop",30), tw=wetWindow(H,"thunder",20), lvl=outlookLevel(idx);
    var s=opener()+" ";
    if((t==="storms"||t==="general")&&lvl&&lvl>=2){ s+="There's a level "+lvl+" of 5 severe risk over "+site+" "+nm+(tw?" — the window we're watching is "+fmtWin(tw.a,tw.b):"")+". That's HEADS UP territory: keep the plan, know your shelter, and we'll call it the moment anything is warned. "; if(pp<20&&th<20) s+="The hour-by-hour is still mostly dry, so this is a watch-it, not a cancel-it."; if(ag) s+=" "+ag.charAt(0).toUpperCase()+ag.slice(1)+"."; return s.replace(/\s+/g," ").trim(); }
    if(t==="rain"||t==="general"||t==="storms"){
      if(pp<20&&th<20){ s+="Dry "+nm+" at "+site+"."+(t!=="general"&&d.hi!=null?" High near "+d.hi+"°"+(d.gust>=25?", gusts to "+d.gust+" mph":"")+".":""); if(t!=="general"&&ag&&c<=2) s+=" "+ag.charAt(0).toUpperCase()+ag.slice(1)+" though, so keep an eye on it."; }
      else {
        var lead= th>=30?(pp>=60?"Storms likely":"A chance of storms"): pp>=60?"Rain likely": pp>=40?"A decent chance of rain":"A slight chance of rain";
        s+=lead+" "+nm+(rw?", "+fmtWin(rw.a,rw.b):"")+". ";
        if(d.rr&&d.rr[1]!=null){ s+="Amounts: most likely "+inch(d.rr[1])+", with the middle half of the models between "+inch(d.rr[0])+" and "+inch(d.rr[2])+". "; }
        if(th>=20){ s+= tw?("Thunder window "+fmtWin(tw.a,tw.b)+(tw.peak>=40?" — that's the stretch to plan around.":".")):"Some thunder possible with it. "; s+=" "; }
        if(ag) s+=(ag.charAt(0).toUpperCase()+ag.slice(1))+(c<=2?", so expect this to move — we'd rather tell you now than surprise you.":".");
      }
      if(t==="general"&&d.hi!=null) s+=" High "+d.hi+"°"+(d.lo!=null?", low "+d.lo+"°":"")+(d.gust>=25?", gusts to "+d.gust+" mph":"")+"."+(pp<20&&th<20?" Good day to get things done outside.":"");
    } else if(t==="wind"){
      var gw=wetWindow(H,"gust",25); s+=(d.wind?"Wind "+d.wind+" mph":"Light wind")+(d.gust?", gusts to "+d.gust+" mph":"")+" "+nm+"."+(gw?" Windiest "+fmtWin(gw.a,gw.b)+".":"")+(d.gust>=35?" That's enough to hold lifts and loose material.":d.gust>=25?" Fine for most work; spraying is marginal.":"");
    } else if(t==="cold"){
      s+=(d.lo!=null?"Low "+(idx===0?"tonight":nm+" night")+" around "+d.lo+"°":"No low available yet")+". "+(d.lo!=null&&d.lo<=28?"Hard freeze — protect anything tender and drain lines.":d.lo!=null&&d.lo<=32?"Freeze likely; cover what you can.":d.lo!=null&&d.lo<=36?"Frost is possible in the low spots.":"No frost concern.")+(ag?" "+(ag.charAt(0).toUpperCase()+ag.slice(1))+".":"");
    } else if(t==="temp"){
      var fl=null; try{ var F=H.filter(function(h){ return h.feel!=null&&hrOf(h.t)>=10&&hrOf(h.t)<=18; }); if(F.length) fl=Math.max.apply(null,F.map(function(h){ return h.feel; })); }catch(e){}
      s+="High near "+d.hi+"° "+nm+(fl!=null&&fl-d.hi>=3?", feels like "+fl+"° at the peak":"")+". "+(d.hi>=95?"Heat is the issue — shift heavy work early and push water.":d.hi>=88?"Warm enough to matter for crews by early afternoon.":"Comfortable for outdoor work.");
    } else if(t==="snow"){
      s+=(d.snowP>=30?"Snow chance "+d.snowP+"% "+nm+(d.sr&&d.sr[1]?" — most likely about "+(d.sr[1]/10).toFixed(1)+'"':"")+".":"No snow in the picture for "+nm+".")+(ag?" "+(ag.charAt(0).toUpperCase()+ag.slice(1))+".":"");
    }
    return s.replace(/\s+/g," ").trim();
  }
  return { answer:answer, ok:function(){ return !!(P&&days().length); } };

SDR_ENGINE.attachments=function(q){
  var P=null; try{ P=window.parent&&window.parent!==window?window.parent:null; }catch(e){} if(!P) return [];

      try{ var o=svg.querySelectorAll("*"), n=cl.querySelectorAll("*"); for(var i=0;i<o.length&&i<n.length;i++){ var cs=P.getComputedStyle(o[i]); if(/text|tspan/i.test(o[i].tagName)){ n[i].setAttribute("font-size",cs.fontSize); n[i].setAttribute("font-family",cs.fontFamily); n[i].setAttribute("font-weight",cs.fontWeight); n[i].setAttribute("letter-spacing",cs.letterSpacing); n[i].setAttribute("fill",cs.fill); if(cs.paintOrder) n[i].setAttribute("paint-order",cs.paintOrder); if(cs.stroke&&cs.stroke!=="none"){ n[i].setAttribute("stroke",cs.stroke); n[i].setAttribute("stroke-width",cs.strokeWidth); } } if(cs.display==="none") n[i].remove(); } }catch(e){} var t=c.querySelector(".mlab b"); return {svg:cl.outerHTML,title:t?t.textContent.replace(/\u00c2/g,"").trim():"Map"}; }catch(e){ return null; } }
  var W=null; try{ W=(function(){ var D=P.STRIPS.days(); var today=new Date(); today.setHours(0,0,0,0); var DAYN=["sunday","monday","tuesday","wednesday","thursday","friday","saturday"]; var idx=null;
    if(/\btonight\b|\btoday\b|\bnow\b/.test(ql)) idx=0; else if(/\btomorrow\b/.test(ql)) idx=1; else for(var i=0;i<7;i++){ if(new RegExp("\\b"+DAYN[i].slice(0,3)+"[a-z]*\\b").test(ql)){ var d=new Date(today); d.setDate(d.getDate()+((i-today.getDay()+7)%7)); idx=D.findIndex(function(x){ return new Date(x.date).toDateString()===d.toDateString(); }); break; } }
    if(idx==null&&/\bweekend\b/.test(ql)) idx=D.findIndex(function(x){ return new Date(x.date).getDay()===6; }); if(idx==null||idx<0) idx=0; return {idx:idx,day:D[idx]}; })(); }catch(e){}
  var storms=/thunder|storm|severe|lightning|tornado|hail/.test(ql), rain=/rain|shower|wet|precip|how much|amount|inch/.test(ql), now=/\bnow\b|\bradar\b|currently/.test(ql);
  if(now){ var r=card(/^radar$/); if(r) out.push(r); }
  if(storms&&W){ var n=W.idx+1; var s=card(new RegExp("^spc"+n+"$"))||card(/^spc48$/); if(s) out.push(s); var md=card(/^md$/); if(md&&W.idx===0) out.push(md); }
  if(rain&&!storms){ var qp=card(/^qpf$/,/1.7|1–7|DAYS 1/)||card(/^qpf$/); if(qp) out.push(qp); }
  // Emma's own chart: rain chance (and thunder) by hour for the day asked about, when the hours exist
  if(W&&W.day&&(rain||storms||/good for|plan|work|outside|game|kickoff|mow|concrete/.test(ql))){ try{ var day=new Date(W.day.date).toDateString(); var H=P.STRIPS.hours().filter(function(h){ return new Date(h.t).toDateString()===day; });
      if(H.length>=6&&H.some(function(h){ return (h.pop||0)>=20; })){ var Wd=320,Hh=140,L=22,R=Wd-22,top=22,bot=Hh-22; var hrs=H.map(function(h){ return new Date(h.t).getHours(); }); var k0=Math.min.apply(null,hrs), span=Math.max(1,Math.max.apply(null,hrs)-k0); var X=function(k){ return L+(R-L)*(k-k0)/span; }, Y=function(v){ return bot-(bot-top)*v/100; }; var bw=Math.max(6,Math.min(14,(R-L)/(span+1)*0.7));
        var bars=H.map(function(h){ var v=h.pop||0; if(!v) return ""; var k=new Date(h.t).getHours(); var col=(h.thunder||0)>=30?"#F5A524":v>=60?"#2F7BFF":v>=40?"#4FA3FF":"#8CC8FF"; return '<rect x="'+(X(k)-bw/2)+'" y="'+Y(v)+'" width="'+bw+'" height="'+(bot-Y(v))+'" rx="2" fill="'+col+'"/>'+((h.thunder||0)>=20?'<text x="'+X(k)+'" y="'+(Y(v)-6)+'" text-anchor="middle" font-size="9" fill="#FFC857">⚡</text>':""); }).join("");
        var ax=[0,6,12,18].filter(function(k){ return k>=k0&&k<=k0+span; }).map(function(k){ return '<text x="'+X(k)+'" y="'+(Hh-6)+'" font-size="10" font-weight="700" fill="#DCE6F5" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif">'+(k===0?"12 AM":k===12?"NOON":(k%12)+(k<12?" AM":" PM"))+'</text>'; }).join("");
        var bands=[40,60].map(function(v){ return '<line x1="'+L+'" x2="'+R+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(255,255,255,.15)" stroke-dasharray="3 4"/>'; }).join("");
        var svg='<svg viewBox="0 0 '+Wd+' '+Hh+'" style="width:100%;height:auto;display:block;background:#0E1A33"><text x="'+L+'" y="14" font-size="11" font-weight="800" letter-spacing=".08em" fill="#fff" font-family="Barlow Condensed,Arial Narrow,sans-serif">RAIN CHANCE · '+(W.idx===0?"TODAY":W.idx===1?"TOMORROW":(W.day.long||W.day.d||"").toUpperCase())+'</text>'+bands+bars+'<line x1="'+L+'" x2="'+R+'" y1="'+bot+'" y2="'+bot+'" stroke="rgba(255,255,255,.25)"/>'+ax+'</svg>';
        out.push({svg:svg,title:"Rain chance by hour"}); } }catch(e){} }
  return out.slice(0,2);
};
