<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SDR Forecast Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1428;--panel:#0E1A33;--panel2:#13224A;--line:rgba(160,180,215,.18);--fg:#F4F7FB;--muted:#A9B6CC;--dim:#7385A3;--blue:#3B82F6;--clear:#22C55E;--heads:#F5B800;--action:#E5484D;--display:"Barlow Condensed",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#0B1730;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:19px}
.top .cnt{font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:13px;color:var(--muted)}
.top .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.top select{background:#0B1730;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
main{max-width:860px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
.empty{color:var(--muted);text-align:center;padding:50px 10px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.concern{border-color:rgba(229,72,77,.55)}
.card.watch{border-color:rgba(245,184,0,.45)}
.ch{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ch b{font-family:var(--display);font-weight:800;letter-spacing:.08em;font-size:15px}
.ch .age{margin-left:auto;color:var(--dim);font-size:12.5px}
.lv{font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:11px;border-radius:4px;padding:2px 7px}
.lv.clear{background:rgba(34,197,94,.16);color:var(--clear)} .lv.watch{background:rgba(245,184,0,.18);color:var(--heads)} .lv.concern{background:rgba(229,72,77,.2);color:#FF8A8E}
.q{padding:12px 14px 4px;font-size:17px;line-height:1.4}
.ev{padding:0 14px 6px;color:#CFE4FF;font-size:14px}
.ev:before{content:"◷ ";color:var(--dim)}
.issue{margin:6px 14px 10px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);font-weight:600;font-size:15px}
.brief{margin:0 14px 10px;padding:0;list-style:none;display:grid;gap:4px}
.brief li{font-size:13.5px;color:#C9D3E3;line-height:1.4;padding-left:14px;position:relative}
.brief li:before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.k{font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:11px;color:var(--dim);margin:0 14px 4px}
textarea{display:block;width:calc(100% - 28px);margin:0 14px 10px;min-height:96px;resize:vertical;background:#0B1730;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15.5px;line-height:1.42;outline:none}
textarea:focus{border-color:var(--blue)}
.att{display:flex;flex-wrap:wrap;gap:8px;margin:0 14px 10px}
.att label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.att input{accent-color:var(--blue)}
.acts{display:flex;gap:8px;padding:0 14px 14px}
.acts button{border:1.5px solid var(--line);border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:14px}
.acts .send{background:var(--clear);border-color:var(--clear);color:#06210F}
.acts .send:disabled{opacity:.5}
.acts .drop{margin-left:auto;color:var(--muted)}
.hist{margin:0 14px 8px;font-size:12.5px;color:var(--dim)}
.hist summary{cursor:pointer}
.hist p{margin:4px 0;color:var(--muted)}
.login{max-width:380px;margin:60px auto;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:grid;gap:12px}
.login h2{margin:0;font-family:var(--display);letter-spacing:.12em}
.login input{background:#0B1730;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
.login button{background:var(--blue);border-radius:10px;padding:11px;font-family:var(--display);font-weight:800;letter-spacing:.12em}
.err{color:#FF8A8E;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#13224A;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="top"><h1>SDR FORECAST DESK</h1><span class="cnt" id="cnt"></span><span class="me">Sending as <select id="met"><option>Lily</option><option>Miller</option><option>Emma</option><option>Matthew</option><option>Anne</option></select></span></div>
<main id="main"></main>
<script>
(async function(){
  const main=document.getElementById("main"), cnt=document.getElementById("cnt"), met=document.getElementById("met");
  const ss=(k,v)=>{ try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v); }catch(e){ return null; } };
  const ls=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
  if(ls("desk-met")) met.value=ls("desk-met"); met.onchange=()=>ls("desk-met",met.value);
  let URL0=""; try{ const j=await (await fetch("./channel.json?_="+Date.now(),{cache:"no-store"})).json(); URL0=String(j.aiChatUrl||"").replace(/\/$/,""); }catch(e){}
  if(!URL0){ main.innerHTML='<div class="empty">The chat server isn\'t connected yet.<br>Add its address to <b>channel.json → aiChatUrl</b>.</div>'; return; }
  let KEY=ss("desk-key")||"";
  const api=(p,body)=>fetch(URL0+p,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Desk-Key":KEY},body:body?JSON.stringify(body):undefined}).then(async r=>{ const j=await r.json().catch(()=>({})); if(!r.ok) throw Object.assign(new Error(j.error||r.status),{status:r.status}); return j; });
  function login(msg){ main.innerHTML=`<form class="login"><h2>DESK SIGN-IN</h2><input type="password" placeholder="Desk password" autocomplete="current-password" required>${msg?`<div class="err">${msg}</div>`:""}<button>SIGN IN</button></form>`;
    main.querySelector("form").onsubmit=e=>{ e.preventDefault(); KEY=main.querySelector("input").value; ss("desk-key",KEY); start(); }; }
  const toast=t=>{ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); };
  const age=t=>{ const m=Math.round((Date.now()-t)/60000); return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"; };
  const esc=s=>String(s||"").replace(/[&<]/g,c=>c==="&"?"&amp;":"&lt;");
  const shown=new Set(); let timer=null;
  function card(it){ const c=document.createElement("div"); const lv=["clear","watch","concern"].includes(it.level)?it.level:"watch"; c.className="card "+lv; c.dataset.id=it.id;
    const att=["radar","hourly","outlook","rain"]; const lab={radar:"📡 Radar snapshot",hourly:"📈 Hour by hour",outlook:"🗺 Outlook map",rain:"🌧 Rain this week"};
    c.innerHTML=`<div class="ch"><span class="lv ${lv}">${lv==="concern"?"CONCERN":lv==="clear"?"ROUTINE":"WATCH"}</span><b>${esc(it.client||it.site)}</b><span class="age" data-t="${it.t}">${age(it.t)}</span></div>
      <div class="q">“${esc(it.question)}”</div>${it.event?`<div class="ev">${esc(it.event)}</div>`:""}
      ${it.issue?`<div class="issue">${esc(it.issue)}</div>`:""}
      ${(it.briefing||[]).length?`<div class="k">BRIEFING</div><ul class="brief">${it.briefing.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}
      ${(it.history||[]).length?`<details class="hist"><summary>Earlier in this conversation</summary>${it.history.map(h=>`<p><b>${h.role==="user"?"Client":"Team"}:</b> ${esc(h.content)}</p>`).join("")}</details>`:""}
      <div class="k">DRAFT — EDIT FREELY</div><textarea>${esc(it.draft)}</textarea>
      <div class="att">${att.map(a=>`<label><input type="checkbox" value="${a}" ${(it.attach||[]).includes(a)?"checked":""}>${lab[a]}</label>`).join("")}</div>
      <div class="acts"><button class="send" type="button">SEND</button><button class="drop" type="button">DISMISS</button></div>`;
    c.querySelector(".send").onclick=async()=>{ const b=c.querySelector(".send"); b.disabled=true; b.textContent="SENDING…";
      try{ await api("/desk/send",{id:it.id,text:c.querySelector("textarea").value.trim(),met:met.value,attach:[...c.querySelectorAll(".att input:checked")].map(x=>x.value)}); c.remove(); shown.delete(it.id); toast("Sent as "+met.value); count(); }
      catch(e){ b.disabled=false; b.textContent="SEND"; toast(e.status===404?"Already answered by someone else":"Didn't send — try again"); if(e.status===404){ c.remove(); shown.delete(it.id); count(); } } };
    c.querySelector(".drop").onclick=async()=>{ try{ await api("/desk/dismiss",{id:it.id}); }catch(e){} c.remove(); shown.delete(it.id); count(); };
    return c; }
  function count(){ const n=main.querySelectorAll(".card").length; cnt.textContent=n?`· ${n} WAITING`:""; document.title=(n?`(${n}) `:"")+"SDR Forecast Desk";
    if(!n&&!main.querySelector(".empty")) main.innerHTML='<div class="empty">Nothing waiting. New questions appear here with a briefing and a draft.</div>'; }
  async function refresh(){ try{ const j=await api("/desk/queue"); const items=j.items||[]; const em=main.querySelector(".empty"); if(items.length&&em) em.remove();
      items.forEach(it=>{ if(shown.has(it.id)) return; shown.add(it.id); main.appendChild(card(it)); });
      main.querySelectorAll(".age").forEach(a=>a.textContent=age(+a.dataset.t)); count(); }
    catch(e){ if(e.status===401){ clearInterval(timer); ss("desk-key",""); login("Wrong password."); } } }
  function start(){ main.innerHTML='<div class="empty">Loading…</div>'; refresh(); clearInterval(timer); timer=setInterval(refresh,8000); }
  if(!KEY) login(); else start();
})();
</script>
</body>
</html>
